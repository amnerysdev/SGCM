<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Restablecer contraseña</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="eyebrow">SGCM</p><h1>Restablecer contraseña</h1><p class="lead">Elige una nueva contraseña para tu cuenta.</p>
        <div id="feedback" class="alert" role="alert" aria-live="assertive" hidden></div>
        <form id="reset-password-form" novalidate>
          <div class="field"><label for="newPassword">Nueva contraseña</label><div class="input-shell"><svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></svg><input type="password" id="newPassword" name="newPassword" placeholder="Mínimo 12 caracteres" required autocomplete="new-password" aria-describedby="newPassword-error password-help" /><button class="password-toggle" type="button" aria-label="Mostrar nueva contraseña" aria-pressed="false"><svg class="icon-eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c5.2 0 8.6 5.1 9 7-0.2.9-1.1 2.6-2.6 4.1M6.2 6.2C4.3 7.7 3.2 10 3 12c.4 1.9 3.8 7 9 7 1.5 0 2.8-.4 4-1"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12s3.4-7 9-7 9 7 9 7-3.4 7-9 7-9-7-9-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p id="password-help" class="helper-text">Usa 12 o más caracteres, con mayúscula, minúscula, número y símbolo.</p><p id="newPassword-error" class="field-error" aria-live="polite"></p></div>
          <div class="field"><label for="confirmPassword">Confirmar contraseña</label><div class="input-shell"><svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></svg><input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repite tu contraseña" required autocomplete="new-password" aria-describedby="confirmPassword-error" /><button class="password-toggle" type="button" aria-label="Mostrar confirmación de contraseña" aria-pressed="false"><svg class="icon-eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c5.2 0 8.6 5.1 9 7-0.2.9-1.1 2.6-2.6 4.1M6.2 6.2C4.3 7.7 3.2 10 3 12c.4 1.9 3.8 7 9 7 1.5 0 2.8-.4 4-1"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12s3.4-7 9-7 9 7 9 7-3.4 7-9 7-9-7-9-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div><p id="confirmPassword-error" class="field-error" aria-live="polite"></p></div>
          <button type="submit"><span class="button-label">Restablecer contraseña</span><span class="button-loading" hidden>Actualizando…</span></button>
        </form>
        <p class="switch-link"><a href="/index.html">Volver a iniciar sesión</a></p>
      </div>
    </div>
    <script type="module" src="/src/reset-password.js"></script>
  </body>
</html>
