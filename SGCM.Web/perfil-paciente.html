<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil del paciente | SGCM</title>

    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/styles/pages/patient-profile.css">

</head>

<body data-page="patient-profile">
    <main class="dashboard">
        <section class="profile-header">
            <div>
                <h1>Mi perfil de paciente</h1>
                <p>
                    Consulta tu información personal registrada
                    en el sistema.
                </p>
            </div>

            <div
                class="avatar"
                id="patient-initials">
                PA
            </div>
        </section>

        <div
            id="profile-message"
            class="message"
            role="status"
            aria-live="polite">
        </div>

        <section class="profile-grid">
            <article class="profile-card full">
                <p class="field-label">
                    Nombre completo
                </p>

                <p
                    class="field-value loading"
                    id="patient-name">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Correo electrónico
                </p>

                <p
                    class="field-value loading"
                    id="patient-email">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Número de seguridad social
                </p>

                <p
                    class="field-value loading"
                    id="patient-ssn">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Fecha de nacimiento
                </p>

                <p
                    class="field-value loading"
                    id="patient-dob">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Dirección
                </p>

                <p
                    class="field-value loading"
                    id="patient-address">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Identificador del paciente
                </p>

                <p
                    class="field-value loading"
                    id="patient-id">
                    Cargando...
                </p>
            </article>
        </section>

        <button
            id="retry-profile"
            type="button"
            hidden>
            Reintentar
        </button>
    </main>

    <script
        type="module"
        src="/src/pacientes.js">
    </script>
    <script type="module" src="/src/app-shell.js"></script>
  </body>
</html>
