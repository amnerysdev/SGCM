<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Iniciar sesión</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img class="auth-logo" src="/src/assets/logo-simple.png" alt="SGCM" /><h1>Bienvenido de nuevo</h1><p class="lead">Ingresa tus datos para acceder a tu cuenta.</p>
        <div id="feedback" class="alert" role="alert" aria-live="assertive" hidden></div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <div class="input-shell"><svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h12.5A2.75 2.75 0 0 1 21 6.75v10.5A2.75 2.75 0 0 1 18.25 20H5.75A2.75 2.75 0 0 1 3 17.25V6.75Z"/><path d="m4 6 8 6 8-6"/></svg><input type="email" id="email" name="email" placeholder="nombre@correo.com" required autocomplete="email" inputmode="email" aria-describedby="email-error" />
            </div>
            <p id="email-error" class="field-error" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-shell"><svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"/></svg><input type="password" id="password" name="password" placeholder="Tu contraseña" required autocomplete="current-password" aria-describedby="password-error" /><button class="password-toggle" type="button" aria-label="Mostrar contraseña" aria-pressed="false"><svg class="icon-eye-closed" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 3 18 18"/><path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c5.2 0 8.6 5.1 9 7-0.2.9-1.1 2.6-2.6 4.1M6.2 6.2C4.3 7.7 3.2 10 3 12c.4 1.9 3.8 7 9 7 1.5 0 2.8-.4 4-1"/><circle cx="12" cy="12" r="3"/></svg><svg class="icon-eye-open" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12s3.4-7 9-7 9 7 9 7-3.4 7-9 7-9-7-9-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            <p id="password-error" class="field-error" aria-live="polite"></p>
          </div>
          <button type="submit"><span class="button-label">Entrar</span><span class="button-loading" hidden>Verificando…</span></button>
        </form>
        <p class="switch-link"><a href="/forgot-password.html">¿Olvidaste tu contraseña?</a></p>
        <p class="switch-link">¿No tienes cuenta? <a href="/register.html">Crea una cuenta</a></p>
      </div>
    </div>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
