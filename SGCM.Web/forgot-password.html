<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SGCM - Recuperar contraseña</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <p class="eyebrow">SGCM</p><h1>Recuperar contraseña</h1><p class="lead">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
        <div id="feedback" class="alert" role="alert" aria-live="assertive" hidden></div>
        <form id="forgot-password-form" novalidate>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <div class="input-shell"><svg class="input-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6.75A2.75 2.75 0 0 1 5.75 4h12.5A2.75 2.75 0 0 1 21 6.75v10.5A2.75 2.75 0 0 1 18.25 20H5.75A2.75 2.75 0 0 1 3 17.25V6.75Z"/><path d="m4 6 8 6 8-6"/></svg><input type="email" id="email" name="email" placeholder="nombre@correo.com" required autocomplete="email" inputmode="email" aria-describedby="email-error" /></div>
            <p id="email-error" class="field-error" aria-live="polite"></p>
          </div>
          <button type="submit"><span class="button-label">Enviar enlace de recuperación</span><span class="button-loading" hidden>Enviando…</span></button>
        </form>
        <p class="switch-link"><a href="/index.html">Volver a iniciar sesión</a></p>
      </div>
    </div>
    <script type="module" src="/src/forgot-password.js"></script>
  </body>
</html>
