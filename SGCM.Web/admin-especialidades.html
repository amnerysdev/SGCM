<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administrar especialidades | SGCM</title>

    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/styles/pages/admin-specialties.css">

</head>

<body data-page="specialties-admin">
    <main class="admin-container">
        <header class="page-header">
            <h1>Administrar especialidades</h1>

            <p>
                Crea, actualiza y organiza las especialidades
                médicas disponibles.
            </p>
        </header>

        <div
            id="specialty-message"
            class="message"
            role="status"
            aria-live="polite">
        </div>

        <div class="admin-grid">
            <section class="panel">
                <h2 id="form-title">
                    Nueva especialidad
                </h2>

                <form id="specialty-form">
                    <input
                        type="hidden"
                        id="specialty-id">

                    <label for="specialty-name">
                        Nombre
                    </label>

                    <input
                        id="specialty-name"
                        name="name"
                        type="text"
                        maxlength="100"
                        required
                        autocomplete="off">

                    <label for="specialty-description">
                        Descripción
                    </label>

                    <textarea
                        id="specialty-description"
                        name="description"
                        maxlength="500"></textarea>

                    <div class="form-actions">
                        <button
                            id="save-specialty"
                            type="submit">
                            Guardar
                        </button>

                        <button
                            id="cancel-edit"
                            class="secondary-button"
                            type="button"
                            hidden>
                            Cancelar
                        </button>
                    </div>
                </form>
            </section>

            <section class="panel">
                <h2>Especialidades registradas</h2>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="specialties-body">
                            <tr>
                                <td
                                    class="empty-state"
                                    colspan="3">
                                    Cargando especialidades...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script
        type="module"
        src="/src/especialidades.js">
    </script>
    <script type="module" src="/src/app-shell.js"></script>
  </body>
</html>
