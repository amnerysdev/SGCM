<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil del doctor | SGCM</title>

    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/styles/pages/doctor-profile.css">

</head>

<body data-page="doctor-profile">
    <main class="dashboard">
        <section class="profile-header">
            <div>
                <h1>Mi perfil médico</h1>
                <p>
                    Consulta tu información profesional y
                    especialidad registrada.
                </p>
            </div>

            <div
                class="avatar"
                id="doctor-initials">
                DR
            </div>
        </section>

        <div
            id="profile-message"
            class="message"
            role="status"
            aria-live="polite">
        </div>

        <section class="profile-grid">
            <article class="profile-card full">
                <p class="field-label">
                    Nombre completo
                </p>

                <p
                    class="field-value loading"
                    id="doctor-name">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Correo electrónico
                </p>

                <p
                    class="field-value loading"
                    id="doctor-email">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Número de exequátur
                </p>

                <p
                    class="field-value loading"
                    id="doctor-license">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Especialidad
                </p>

                <p
                    class="field-value loading"
                    id="doctor-specialty">
                    Cargando...
                </p>
            </article>

            <article class="profile-card">
                <p class="field-label">
                    Identificador del doctor
                </p>

                <p
                    class="field-value loading"
                    id="doctor-id">
                    Cargando...
                </p>
            </article>
        </section>

        <button
            id="retry-profile"
            type="button"
            hidden>
            Reintentar
        </button>
    </main>

    <script
        type="module"
        src="/src/doctores.js">
    </script>
    <script type="module" src="/src/app-shell.js"></script>
  </body>
</html>
